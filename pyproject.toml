[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "email-assistant"
version = "0.1.0"
description = "MailPilot application"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "google-cloud-secret-manager>=2.24,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.8,<3",
    "tzdata>=2025.2",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<3",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[project.scripts]
mailpilot-job = "email_assistant.job:main"
mailpilot-ingress = "email_assistant.api.ingress:main"
mailpilot-worker = "email_assistant.api.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/email_assistant"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
